// Ratings to populate in dropdowns
const ratingOptions = ["Outstanding (4)", "Average (3)", "Needs Improvement (2)", "Unacceptable (1)", "N/A"];

function buildForm() {
  const container = document.getElementById("evaluation-form");
  
  evaluationData.forEach((section, sectionIndex) => {
    // Create a title for the section
    const sectionTitle = document.createElement("div");
    sectionTitle.className = "section-title";
    sectionTitle.textContent = section.category;
    container.appendChild(sectionTitle);

    // Create a table
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    
    // Define columns
    ["Performance Indicator", "Rating", "Behavioral Descriptors", "Comments / Evidence"].forEach(colTitle => {
      const th = document.createElement("th");
      th.textContent = colTitle;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Build table rows
    const tbody = document.createElement("tbody");
    section.items.forEach((item, itemIndex) => {
      const row = document.createElement("tr");
      
      // 1) Performance Indicator
      const tdIndicator = document.createElement("td");
      tdIndicator.textContent = item.indicator;
      row.appendChild(tdIndicator);

      // 2) Rating dropdown
      const tdRating = document.createElement("td");
      const selectRating = document.createElement("select");
      // Give it an ID or data attribute to reference later
      selectRating.setAttribute("data-section-index", sectionIndex);
      selectRating.setAttribute("data-item-index", itemIndex);
      
      // Add default option
      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = "Select Rating";
      selectRating.appendChild(defaultOption);

      ratingOptions.forEach(opt => {
        const option = document.createElement("option");
        option.value = opt;
        option.textContent = opt;
        selectRating.appendChild(option);
      });
      tdRating.appendChild(selectRating);
      row.appendChild(tdRating);
      
      // 3) Behavioral Descriptors
      const tdDescriptor = document.createElement("td");
      tdDescriptor.textContent = item.descriptor;
      row.appendChild(tdDescriptor);

      // 4) Comments / Evidence
      const tdComments = document.createElement("td");
      const textareaComments = document.createElement("textarea");
      textareaComments.setAttribute("data-section-index", sectionIndex);
      textareaComments.setAttribute("data-item-index", itemIndex);
      tdComments.appendChild(textareaComments);
      row.appendChild(tdComments);

      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    container.appendChild(table);
  });
}

function generateCSV() {
  // Grab Director Name and School from top form fields
  const directorName = document.getElementById("directorName").value.trim();
  const schoolName = document.getElementById("schoolName").value.trim();
  
  // Build CSV rows from form data
  const headers = ["Director Name","School","Category","Performance Indicator","Rating","Behavioral Descriptors","Comments/Evidence"];
  let csvContent = headers.join(",") + "\n";

  evaluationData.forEach((section, sectionIndex) => {
    section.items.forEach((item, itemIndex) => {
      // Get rating from the corresponding <select>
      const selectElem = document.querySelector(`select[data-section-index='${sectionIndex}'][data-item-index='${itemIndex}']`);
      const ratingValue = selectElem ? selectElem.value : "";

      // Get comments from the corresponding <textarea>
      const textareaElem = document.querySelector(`textarea[data-section-index='${sectionIndex}'][data-item-index='${itemIndex}']`);
      // Remove line breaks to avoid messing up CSV format
      const commentsValue = textareaElem ? textareaElem.value.replace(/(\r\n|\n|\r)/gm, " ") : ""; 

      // Build a row
      const row = [
        wrapCSV(directorName),
        wrapCSV(schoolName),
        wrapCSV(section.category),
        wrapCSV(item.indicator),
        wrapCSV(ratingValue),
        wrapCSV(item.descriptor),
        wrapCSV(commentsValue)
      ].join(",");

      csvContent += row + "\n";
    });
  });

  // Create a Blob and download it
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", "director_evaluation.csv");
  link.style.display = "none";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Utility function to safely wrap CSV fields with quotes, handle any internal quotes/commas
function wrapCSV(val) {
  if (val === null || val === undefined) return "";
  // Escape double quotes by doubling them
  let newVal = val.replace(/"/g, '""');
  // If value contains a comma, quote, or newline, wrap in quotes
  if (/[",\n]/.test(newVal)) {
    newVal = `"${newVal}"`;
  }
  return newVal;
}
